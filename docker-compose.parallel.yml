# =============================================================================
# Lumiton·Omax — Parallel Deployment (v2)
# =============================================================================
#
# 与旧版本并行运行，端口和数据卷全部偏移，避免冲突。
#
# 使用方式:
#   docker compose -f docker-compose.parallel.yml --env-file .env.parallel up -d
#
# 端口对照:
#   SurrealDB: 8000 → 8001
#   API:       5055 → 5056
#   Frontend:  8502 → 8503
# =============================================================================

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root
    ports:
      - "8001:8000"
    volumes:
      - ./surreal_data_v2:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    image: lfnovo/open_notebook:local
    ports:
      - "8503:8502"
      - "5056:5055"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=change-me-to-a-secret-string
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - SURREAL_POOL_SIZE=20
      - SURREAL_POOL_ACQUIRE_TIMEOUT=10.0
      - CCORE_DOCUMENT_ENGINE=docling
      - ENABLE_KNOWLEDGE_GRAPH=true
      - KG_ENTITY_TYPES=MATERIAL,CHEMICAL,PROPERTY,CONDITION,RESULT,EXPERIMENT,PRODUCT,METHOD
      - KG_RELATION_TYPES=USES_MATERIAL,HAS_CONDITION,YIELDS_RESULT,CONTAINS_CHEMICAL,MEASURES_PROPERTY,COMPARES_WITH,APPLIES_TO
    volumes:
      - ./notebook_data_v2:/app/data
    depends_on:
      - surrealdb
    restart: always
